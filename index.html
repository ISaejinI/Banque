<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Mini banque V2</title>
    <script src="./index.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="./tests.js"></script> -->
</head>

<body style="font-family: 'Inter', sans-serif;">
    <h1>Mini banque</h1>

    <div id="alert">
        <p id="alertMessage"></p>
    </div>

    <div id="contentContainer">
        <div id="formsContainer">
            <div class="formContainer">
                <h2>Ajout d'un client</h2>
                <form>
                    <label for="createClientFirstName">Prénom</label>
                    <input type="text" name="createClientFirstName" id="createClientFirstName"
                        placeholder="Prénom du client">
                    <label for="createClientLastName">Nom de famille</label>
                    <input type="text" name="createClientLastName" id="createClientLastName"
                        placeholder="Nom de famille du client">
                    <button type="submit" id="createClient">Ajouter le client</button>
                </form>
            </div>
            <div class="formContainer">
                <h2>Création d'un compte</h2>
                <form>
                    <label for="createAccountClient">Client</label>
                    <select name="createAccountClient" id="createAccountClient" class="clientIdSelect">
                    </select>
                    <label for="createAccountName">Nom du compte</label>
                    <input type="text" name="createAccountName" id="createAccountName" placeholder="Nom du compte">
                    <label for="createAccountInitialDeposit">Montant du dépôt d'ouverture</label>
                    <input type="number" name="createAccountInitialDeposit" id="createAccountInitialDeposit"
                        placeholder="Montant du dépôt d'ouverture">
                    <button type="submit" id="createAccount">Créer le compte</button>
                </form>
            </div>
            <!-- <div class="formContainer">
                <h2>Suppression d'un compte</h2>
                <form>
                    <label for="deleteAccountClientId">Id du client</label>
                    <input type="text" name="deleteAccountClientId" id="deleteAccountClientId" placeholder="Id du client">
                    <label for="deleteAccountName">Nom du compte</label>
                    <input type="text" name="deleteAccountName" id="deleteAccountName" placeholder="Nom du compte">
                    <button type="submit" id="deleteAccount">Supprimer le compte</button>
                </form>
            </div> -->
            <div class="formContainer">
                <h2>Dépôt d'argent</h2>
                <form>
                    <label for="depositAccountClient">Client</label>
                    <select name="depositAccountClient" id="depositAccountClient" class="clientIdSelect">
                    </select>
                    <label for="depositAccountName">Nom du compte</label>
                    <select name="depositAccountName" id="depositAccountName">
                    </select>
                    <label for="depositAmount">Montant du dépôt</label>
                    <input type="number" name="depositAmount" id="depositAmount" placeholder="Montant du dépôt">
                    <button type="submit" id="deposit">Déposer l'argent</button>
                </form>
            </div>
            <div class="formContainer">
                <h2>Retrait d'argent</h2>
                <form>
                    <label for="withdrawalClientId">Id du client</label>
                    <input type="text" name="withdrawalClientId" id="withdrawalClientId" placeholder="Id du client">
                    <label for="withdrawalAccountName">Nom du compte</label>
                    <input type="text" name="withdrawalAccountName" id="withdrawalAccountName"
                        placeholder="Nom du compte">
                    <label for="withdrawalAmount">Montant du retrait</label>
                    <input type="number" name="withdrawalAmount" id="withdrawalAmount" placeholder="Montant du retrait">
                    <button type="submit" id="withdrawal">Retirer l'argent</button>
                </form>
            </div>
            <div class="formContainer">
                <h2>Transfert d'argent</h2>
                <form>
                    <label for="transferSenderClientId">Id du client émetteur</label>
                    <input type="text" name="transferSenderClientId" id="transferSenderClientId"
                        placeholder="Id du client émetteur">
                    <label for="transferSenderAccountName">Nom du compte émetteur</label>
                    <input type="text" name="transferSenderAccountName" id="transferSenderAccountName"
                        placeholder="Nom du compte émetteur">
                    <label for="transferReceiverClientId">Id du client récepteur</label>
                    <input type="text" name="transferReceiverClientId" id="transferReceiverClientId"
                        placeholder="Id du client récepteur">
                    <label for="transferReceiverAccountName">Nom du compte récepteur</label>
                    <input type="text" name="transferReceiverAccountName" id="transferReceiverAccountName"
                        placeholder="Nom du compte récepteur">
                    <label for="transferAmount">Montant du transfert</label>
                    <input type="number" name="transferAmount" id="transferAmount" placeholder="Montant du transfert">
                    <button type="submit" id="transfer">Transférer l'argent</button>
                </form>
            </div>
        </div>
        <div>
            <h2>Tous les clients</h2>
            <div class="list">

            </div>
        </div>
        <div>
            <h2>Tous les comptes bancaires</h2>
            <div class="list">

            </div>
        </div>
    </div>

</body>

</html>
